[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-agent"
version = "0.1.0"
description = "Standalone CodeAct agent: pluggable model endpoints with failover, event-stream audit, local web UI, and competition-mode."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "meat-daemon-404" }
]
keywords = ["ai-agent", "codeact", "llm", "mathematical-modelling", "zero-approval"]
dependencies = []

[project.optional-dependencies]
modelling = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/meat-daemon-404/harness-agent"
Repository = "https://github.com/meat-daemon-404/harness-agent.git"
Issues = "https://github.com/meat-daemon-404/harness-agent/issues"
